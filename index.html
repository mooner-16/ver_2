<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRON OATH – 중세 기사 대전</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: Georgia, 'Noto Serif KR', serif; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 로비 */
  #lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(30,24,18,.85), rgba(8,6,4,.97)); z-index: 10; overflow: auto; }
  .panel { width: min(920px, 94vw); padding: 28px; text-align: center; }
  h1 { margin: 0; font-size: 56px; letter-spacing: 12px; color: #e6c473; text-shadow: 0 3px 0 #5a3e12, 0 0 30px rgba(230,196,115,.35); }
  .sub { margin: 4px 0 22px; letter-spacing: 6px; color: #b5a37c; }
  #name { width: 260px; padding: 10px 14px; font: inherit; font-size: 18px; text-align: center; color: #f1e6c8;
    background: #1d1710; border: 1px solid #6d5a33; border-radius: 4px; outline: none; }
  #name:focus { border-color: #e6c473; }
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 20px 0; }
  .card { padding: 14px; text-align: left; background: #1d1710; border: 2px solid #3d3220; border-radius: 6px; cursor: pointer; transition: .15s; }
  .card:hover { border-color: #8a7343; transform: translateY(-2px); }
  .card.sel { border-color: #e6c473; background: #2a2015; box-shadow: 0 0 18px rgba(230,196,115,.25); }
  .card h3 { margin: 0 0 2px; font-size: 20px; }
  .card .d { margin: 0 0 10px; font-size: 13px; color: #b5a37c; }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 4px 0; color: #cdbf9b; }
  .stat span { width: 52px; flex: none; }
  .bar { flex: 1; height: 7px; background: #0e0b07; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #a77d1f, #e6c473); }
  button { padding: 13px 46px; font: inherit; font-size: 20px; letter-spacing: 3px; color: #1a1308; background: linear-gradient(#f0d487, #c79a3a);
    border: 0; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 0 #6b4d12; }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #6b4d12; }
  button:disabled { filter: grayscale(.8); cursor: wait; }
  #lobmsg { min-height: 22px; color: #e08a7a; }
  .ctl { color: #8f805c; font-size: 14px; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: .85; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 3px #000; }
  #crosshair::before { left: 10px; top: 4px; width: 2px; height: 14px; }
  #crosshair::after { top: 10px; left: 4px; height: 2px; width: 14px; }
  #hitmark { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; opacity: 0; transition: opacity .15s;
    border: 3px solid #ff5a4a; transform: rotate(45deg); }
  #hitmark.blocked { border-color: #cfd8e8; }
  #hpwrap { position: absolute; left: 24px; bottom: 24px; width: 300px; }
  #clsname { font-size: 18px; margin-bottom: 6px; text-shadow: 0 2px 4px #000; color: #e6c473; }
  #hpbar { height: 20px; background: rgba(0,0,0,.6); border: 2px solid #6d5a33; border-radius: 3px; overflow: hidden; }
  #hpfill { height: 100%; width: 100%; background: linear-gradient(#d9473a, #8e1d14); transition: width .15s; }
  #hptext { margin-top: 4px; font-size: 14px; text-shadow: 0 2px 4px #000; }
  #kd { position: absolute; right: 24px; bottom: 24px; font-size: 18px; text-shadow: 0 2px 4px #000; text-align: right; }
  #feed { position: absolute; right: 20px; top: 20px; text-align: right; font-size: 16px; text-shadow: 0 2px 4px #000; }
  #feed div { background: rgba(0,0,0,.45); padding: 3px 10px; margin-bottom: 4px; border-radius: 3px; }
  #dmg { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(190,20,10,.85)); transition: opacity .35s; }
  #death { position: absolute; left: 0; right: 0; top: 32%; text-align: center; font-size: 44px; color: #e05a4a; text-shadow: 0 3px 10px #000; display: none; }
  #death small { display: block; font-size: 20px; color: #ddd; margin-top: 8px; }
  #board { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); min-width: 460px; background: rgba(10,8,5,.82);
    border: 2px solid #6d5a33; border-radius: 6px; padding: 14px 18px; display: none; }
  #board table { width: 100%; border-collapse: collapse; }
  #board th, #board td { padding: 5px 8px; text-align: left; font-size: 16px; }
  #board th { color: #e6c473; border-bottom: 1px solid #5a4a2a; }
  #board td.n, #board th.n { text-align: right; }
  #board tr.me td { color: #ffe9a8; font-weight: bold; }
  #pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
    background: rgba(0,0,0,.55); font-size: 28px; z-index: 8; cursor: pointer; }
  #pause small { font-size: 15px; color: #bbb; }
</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="dmg"></div>
  <div id="crosshair"></div>
  <div id="hitmark"></div>
  <div id="feed"></div>
  <div id="hpwrap">
    <div id="clsname"></div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="hptext"></div>
  </div>
  <div id="kd"></div>
  <div id="death"></div>
  <div id="board"><table><thead><tr><th>기사</th><th>클래스</th><th class="n">처치</th><th class="n">사망</th></tr></thead><tbody id="boardbody"></tbody></table></div>
</div>

<div id="pause"><div>클릭하여 전투 재개</div><small>WASD 이동 · Space 점프 · 좌클릭 공격 · 우클릭 방어 · Tab 점수판</small></div>

<div id="lobby">
  <div class="panel">
    <h1>IRON OATH</h1>
    <div class="sub">철 의 맹 세 — 기사 대전</div>
    <input id="name" maxlength="16" placeholder="기사 이름" autocomplete="off">
    <div id="cards"></div>
    <button id="join">전장으로 입장</button>
    <p id="lobmsg"></p>
    <p class="ctl">WASD 이동 · Space 점프 · 좌클릭 공격 · 우클릭 방어(방어 중엔 느려짐) · Tab 점수판</p>
  </div>
</div>

<script type="module" src="/game.js"></script>
</body>
</html>
